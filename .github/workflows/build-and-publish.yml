name: Build extension and publish userscript

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      USERSCRIPT_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and test both targets
        run: pnpm test

      - name: Upload desktop extension
        uses: actions/upload-artifact@v4
        with:
          name: scopus-citescore-quartile-desktop
          path: dist/desktop
          if-no-files-found: error

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload mobile site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/mobile

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish mobile userscript
        id: deployment
        uses: actions/deploy-pages@v4

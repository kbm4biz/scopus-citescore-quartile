name: Build extension and publish userscript

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      USERSCRIPT_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and test both targets
        run: pnpm test

      - name: Read release version
        id: release_version
        run: |
          node -e 'const p=require("./package.json"); console.log("version=" + p.version)' >> "$GITHUB_OUTPUT"

      - name: Package fallback extension
        run: |
          cd dist/desktop
          zip -qr "../../Scopus-CiteScore-Quartile-v${{ steps.release_version.outputs.version }}-desktop.zip" .

      - name: Publish versioned fallback download
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release_version.outputs.version }}
        run: |
          release_tag="v${RELEASE_VERSION}"
          if gh release view "${release_tag}" >/dev/null 2>&1; then
            echo "Release ${release_tag} already exists; leaving its immutable assets unchanged."
          else
            gh release create "${release_tag}" \
              "Scopus-CiteScore-Quartile-v${RELEASE_VERSION}-desktop.zip#Chrome MV3 fallback extension" \
              "dist/mobile/scopus-citescore-quartile.user.js#Universal userscript" \
              --target "${GITHUB_SHA}" \
              --title "Scopus CiteScore Quartile ${release_tag}" \
              --notes "Universal Tampermonkey userscript plus the optional unpacked Chrome extension fallback."
          fi

      - name: Upload fallback extension build
        uses: actions/upload-artifact@v4
        with:
          name: scopus-citescore-quartile-desktop
          path: dist/desktop
          if-no-files-found: error

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload userscript site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/mobile

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish universal userscript
        id: deployment
        uses: actions/deploy-pages@v4

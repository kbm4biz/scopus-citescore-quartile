<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Multiple categories fixture</title>
  <link rel="stylesheet" href="fixture.css">
</head>
<body>
  <main>
    <h1>International Journal of Example Studies</h1>
    <section class="source-metrics"><dl><div><dt>CiteScore</dt><dd>6.8</dd></div></dl></section>
    <section class="rank-section" aria-labelledby="rank-title">
      <h2 id="rank-title">CiteScore Rank &amp; trend</h2>
      <label for="rank-year">CiteScore rank year</label>
      <select id="rank-year"><option selected>2024</option><option>2023</option></select>
      <table>
        <thead><tr><th>In category</th><th>Percentile</th><th>Rank</th></tr></thead>
        <tbody>
          <tr><th>Management Information Systems</th><td>99</td><td>2 out of 210</td></tr>
          <tr><th>Economics and Econometrics</th><td>74%</td><td>1/200</td></tr>
          <tr><th>Education</th><td>49th percentile</td><td>150 of 300</td></tr>
          <tr><th>Library and Information Sciences</th><td>Percentile 24</td><td>Rank #190/250</td></tr>
        </tbody>
      </table>
    </section>
  </main>
  <script src="fixture-bootstrap.js"></script>
  <script src="fixture-loader.js"></script>
</body>
</html>

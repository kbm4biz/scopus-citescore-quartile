<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rank-only fixture</title>
  <link rel="stylesheet" href="fixture.css">
</head>
<body>
  <main>
    <h1>Journal with Rank-Only Data</h1>
    <section class="source-metrics"><dl><div><dt>CiteScore value</dt><dd>3.1</dd></div></dl></section>
    <section class="rank-section" aria-label="CiteScore rank">
      <h2>Rank &amp; trend</h2>
      <p>CiteScore rank year: 2023</p>
      <article class="category-card">
        <dl>
          <div><dt>In category</dt><dd>Public Administration</dd></div>
          <div><dt>Percentile</dt><dd>Not available</dd></div>
          <div><dt>Rank</dt><dd>42 out of 320</dd></div>
        </dl>
      </article>
    </section>
  </main>
  <script src="fixture-bootstrap.js"></script>
  <script src="fixture-loader.js"></script>
</body>
</html>

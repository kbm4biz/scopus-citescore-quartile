<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>One category fixture</title>
  <link rel="stylesheet" href="fixture.css">
</head>
<body>
  <main>
    <h1>Journal of Applied Metrics</h1>
    <section class="source-metrics" aria-label="Source metrics">
      <dl><div><dt>CiteScore</dt><dd>9.4</dd></div></dl>
    </section>
    <section class="rank-section" aria-labelledby="rank-title">
      <h2 id="rank-title">CiteScore rank</h2>
      <p>CiteScore rank year: 2024</p>
      <article class="category-card">
        <dl>
          <div><dt>In category</dt><dd>Business and International Management</dd></div>
          <div><dt>Percentile</dt><dd>86%</dd></div>
          <div><dt>Rank</dt><dd>42/320</dd></div>
        </dl>
      </article>
    </section>
  </main>
  <script src="fixture-bootstrap.js"></script>
  <script src="fixture-loader.js"></script>
  <script>
    setTimeout(() => {
      const note = document.createElement("p");
      note.textContent = "Unrelated update: 2026 records, 400 citations.";
      document.querySelector(".source-metrics").appendChild(note);
    }, 450);
  </script>
</body>
</html>

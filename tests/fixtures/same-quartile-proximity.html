<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Same quartile proximity fixture</title>
  <link rel="stylesheet" href="fixture.css">
</head>
<body>
  <main>
    <h1>Journal of Quartile Placement</h1>
    <section class="source-metrics" aria-label="CiteScore overview">
      <strong>CiteScore</strong>
      <div>5.1</div>
    </section>
    <section class="rank-section" aria-labelledby="rank-heading">
      <h2 id="rank-heading">CiteScore Rank &amp; trend</h2>
      <p>CiteScore rank year <strong>2024</strong></p>
      <table>
        <thead><tr><th>In category</th><th>Percentile</th><th>Rank</th></tr></thead>
        <tbody>
          <tr><th>Near the Q2 threshold</th><td>49%</td><td>51/100</td></tr>
          <tr><th>At the bottom of Q3</th><td>25%</td><td>75/100</td></tr>
        </tbody>
      </table>
    </section>
  </main>
  <script src="fixture-bootstrap.js"></script>
  <script src="fixture-loader.js"></script>
</body>
</html>
